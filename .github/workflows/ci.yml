name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo packages
        run: pnpm -r build

      - name: Run unit & integration test suites
        run: pnpm -r test

      - name: Run Section 53 End-to-End Betting Lifecycle Test
        run: pnpm tsx --test tests/e2e-betting-lifecycle.test.ts

      - name: Run Persistence Mid-Restart & Concurrency Tests
        run: |
          pnpm tsx --test tests/persistence-restart.test.ts
          pnpm tsx --test packages/betting-engine/dist/concurrency.test.js

      - name: Verify Docker-Compose Persistence Profile
        run: |
          docker compose --profile persistence config

