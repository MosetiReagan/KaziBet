apiVersion: apps/v1
kind: Deployment
metadata:
  name: kazibet-api
  labels:
    app.kubernetes.io/name: kazibet-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kazibet-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kazibet-api
    spec:
      containers:
        - name: api
          image: ghcr.io/kazibet/api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: kazibet-config
            - secretRef:
                name: kazibet-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
